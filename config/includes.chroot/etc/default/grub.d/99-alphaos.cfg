# Alpha OS grub defaults. Applied by update-grub via /etc/default/grub.d/*.cfg
# (see /etc/grub.d/00_header, shipped by the grub2 package).
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="Alpha OS"
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash"
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT"
