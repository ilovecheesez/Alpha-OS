name: CI

on:
  push:
    branches: [ main, master, 'kilo/*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate (static, no ISO build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check all shell entry points
        run: |
          set -euo pipefail
          targets=()
          shopt -s nullglob
          targets+=(auto/*)
          targets+=(scripts/*.sh)
          targets+=(config/hooks/*.chroot*)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No shell entry points found to check." >&2
            exit 1
          fi
          for f in "${targets[@]}"; do
            [ -f "$f" ] || continue
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Run static test suite
        run: ./scripts/run-tests.sh

      - name: Assert base distribution is resolute
        run: |
          set -euo pipefail
          # `lb config --mode ubuntu` hard-codes LB_DISTRIBUTION=precise (12.04)
          # unless --distribution is passed explicitly. A regression there
          # silently produces a Precise image, so assert it loudly.
          for f in config/common config/chroot config/binary live/config; do
            [ -f "$f" ] || continue
            if grep -Eq '^[[:space:]]*LB_DISTRIBUTION="?resolute"?[[:space:]]*$' "$f" \
               || grep -q -- '--distribution[[:space:]]\+resolute' "$f"; then
              echo "OK: $f targets resolute"
            else
              echo "FAIL: $f does not target resolute" >&2
              exit 1
            fi
          done
          echo "OK: no config found specifying a non-resolute distribution"

      - name: Assert syslinux theme is live-build
        run: |
          set -euo pipefail
          for f in config/binary live/config; do
            [ -f "$f" ] || continue
            if grep -qE 'live-build|grub-pc-bin|grub-efi-amd64-bin' "$f"; then
              echo "OK: $f uses an installable bootloader/theme"
            else
              echo "FAIL: $f has no live-build / grub bootloader setting" >&2
              exit 1
            fi
            if grep -q 'ubuntu-oneiric' "$f"; then
              echo "FAIL: $f references uninstallable syslinux theme ubuntu-oneiric" >&2
              exit 1
            fi
          done

      - name: Grep for banned legacy identifiers
        run: |
          set -euo pipefail
          # Legacy custom-kernel tree is out of scope; the live-build surfaces
          # below must never reference it.
          mapfile -t hits < <(
            grep -rniE 'vib-?os|unixos|multiboot2|limine' \
              --exclude-dir=.git --exclude-dir=kernel --exclude-dir=libc \
              --exclude-dir=tools --exclude-dir=userspace --exclude-dir=drivers \
              --exclude-dir=boot --exclude-dir=examples --exclude-dir=vendor \
              --exclude-dir=screenshots --exclude-dir=runtimes \
              --exclude-dir=vib-os-x86_64 \
              .github Makefile scripts packages config live 2>/dev/null || true
          )
          if [ ${#hits[@]} -gt 0 ]; then
            printf '%s\n' "${hits[@]}" >&2
            echo "FAIL: legacy identifiers found" >&2
            exit 1
          fi
          echo "OK: no legacy identifiers in live-build surfaces"

      - name: shellcheck (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # SC1091/SC2148/SC2034: these are live-build config fragments
          # sourced by lb, not standalone scripts.
          shellcheck -e SC1091,SC2148,SC2034 auto/* scripts/*.sh || true

      - name: actionlint (non-blocking)
        continue-on-error: true
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint
