name: Build and Release Alpha OS

# This workflow reuses the build+smoke-test implementation from build-iso.yml
# via `workflow_call` rather than duplicating it. The ISO build is expensive
# (full debootstrap of a 4-desktop Ubuntu system), so having two copies of the
# step list would guarantee they drift.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-check tag against repository version
        id: v
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "FAIL: tag '$tag' does not start with 'v'" >&2
              exit 1
              ;;
          esac
          repo_version=$(sed -n 's/^PROJECT_VERSION[[:space:]]*[:?]*=[[:space:]]*//p' Makefile | head -1)
          echo "repo PROJECT_VERSION = '$repo_version'"
          if [ -z "$repo_version" ] || [ "$repo_version" != "$version" ]; then
            echo "FAIL: tag '$tag' (version '$version') does not match Makefile PROJECT_VERSION '$repo_version'" >&2
            exit 1
          fi
          echo "tag = $tag" >> "$GITHUB_OUTPUT"
          echo "version = $version" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  build-and-release:
    name: Build, smoke-test and release
    needs: verify
    uses: ./.github/workflows/build-iso.yml
    permissions:
      contents: write
    with:
      publish: true
      series: resolute
      release_tag: ${{ needs.verify.outputs.tag }}
      expected_version: ${{ needs.verify.outputs.version }}
    secrets: inherit
